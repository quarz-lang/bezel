# Tests the cog against Quarz's main branch, built from source, rotor's and
# pg's main branches (fetched as users get them) and a PostgreSQL server
# (its integration tests read PG_TEST_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so that a change on Quarz's main that breaks the cog shows.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: quarz-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # SCRAM-SHA-256: the image's default for a role with a password.
      PG_TEST_URL: postgres://postgres:quarz-ci@localhost:5432/postgres
    steps:
      - name: Check out this cog
        uses: actions/checkout@v7
      - name: Check out Quarz (main), to build it
        uses: actions/checkout@v7
        with:
          repository: quarz-lang/quarz
          path: .quarz
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .quarz
      - name: Build Quarz
        run: |
          cargo build --release --manifest-path .quarz/Cargo.toml
          echo "$GITHUB_WORKSPACE/.quarz/target/release" >> "$GITHUB_PATH"
      - name: Check
        run: quarz check
      - name: Test (interpreted)
        run: quarz test
      - name: Test (compiled)
        run: quarz test --release
      - name: Doc examples
        run: quarz test --doc
      - name: Docs
        run: quarz doc --check
      # (cli/ is an application and commits its lock, the reproducible
      # one for `cd cli && quarz build`. CI re-resolves it first, so that
      # cli/ is tested against rotor's and pg's main as the cog's steps
      # are, and prints what moved; the committed lock moves by hand, in
      # a pull request, #83.)
      - name: The bezel command (cli/), its lock re-resolved
        working-directory: cli
        run: |
          quarz cog update
          git diff -- Cog.lock
          quarz check
          quarz test --timeout=600s
          quarz test --release --timeout=600s
